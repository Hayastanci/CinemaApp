# Production Docker Compose - Pulls pre-built image directly from GitHub Container Registry (GHCR)
# No local .NET SDK or compilation required!

services:
  # MySQL 8.4 LTS Database
  cinema-db:
    image: mysql:8.4
    container_name: cinema_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cinema_db}
      MYSQL_USER: ${MYSQL_USER:-cinema_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cinema_secure_password_2026}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - cinema_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cinema-network

  # Pre-built ASP.NET Core 10 Web App + Linux FFmpeg from GitHub Container Registry
  cinema-web:
    image: ghcr.io/hayastanci/cinemaapp:latest
    container_name: cinema_web
    restart: always
    depends_on:
      cinema-db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=cinema-db;Port=3306;Database=${MYSQL_DATABASE:-cinema_db};User=${MYSQL_USER:-cinema_user};Password=${MYSQL_PASSWORD:-cinema_secure_password_2026};CharSet=utf8mb4;
      - FFmpeg__BinaryPath=/usr/bin/ffmpeg
      - FFmpeg__ProbePath=/usr/bin/ffprobe
      - FFmpeg__MediaRoot=/var/www/cinema/media
      - FFmpeg__StagingPath=/var/www/cinema/media/staging
      - FFmpeg__MoviesPath=/var/www/cinema/media/movies
      - Jwt__Key=${JWT_KEY:-CinemaApp_Ultra_Secure_Secret_Key_For_Net10_Cinema_App_2026!}
      - Jwt__Issuer=${JWT_ISSUER:-CinemaApp}
      - Jwt__Audience=${JWT_AUDIENCE:-CinemaAppClient}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY:-pk_test_sample}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-sk_test_sample}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-whsec_sample}
      - Gemini__ApiKey=${GEMINI_API_KEY:-}
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - cinema_media_data:/var/www/cinema/media
    networks:
      - cinema-network

volumes:
  cinema_mysql_data:
  cinema_media_data:

networks:
  cinema-network:
    driver: bridge
